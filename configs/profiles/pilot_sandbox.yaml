# Sandbox pilot profile: max_recall preset + strict governance (all G-controls enforced)
profile: pilot_sandbox
decision:
  t_bypass: 0.012
  t_gray_upper: 0.045
  t_force: 0.090
  hysteresis_frames: 1
  bypass_streak_max_frames: 90        # 1.5s @60fps
  bypass_streak_max_seconds: 1.5
  keepalive_every_seconds: 3.0
  overlay_sensitivity: 2.0
governance:
  retention: { temp_dir_ttl_hours: 12, post_eval_purge_business_days: 5 }
  tls: { min_version: "1.3", enforce_verify: true }
  authz: { scopes: [sandbox.read, sandbox.write], require_mfa: true }
dispatch:
  adapters: [mock_queue]
