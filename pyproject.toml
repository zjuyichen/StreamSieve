[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsieve"
version = "0.1.0"
description = "High-Efficiency AI Governance & Sustainable Computational Optimization Framework (stream safety pre-filter)"
readme = "README.md"
requires-python = ">=3.9"  # the reference implementation runs on 3.9; production containers use 3.11
license = { text = "Apache-2.0" }
authors = [{ name = "Yichen Shen" }]
dependencies = []  # core is dependency-free (stdlib); capabilities install via extras for portability and auditability

[project.optional-dependencies]
video = ["av>=12", "numpy>=1.26"]
serving = ["fastapi>=0.110", "uvicorn>=0.29", "grpcio>=1.62", "protobuf>=4.25"]
telemetry = ["prometheus-client>=0.20"]
gpu = ["onnxruntime-gpu>=1.17"]
cloud = ["boto3>=1.34", "google-cloud-storage>=2.16"]
dev = ["pytest>=8", "pytest-benchmark>=4", "ruff>=0.4", "mypy>=1.10", "pyyaml>=6.0"]

[project.scripts]
sieve = "streamsieve.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "perf: performance regression tests (require a machine meeting the profile budget)",
  "soak: long-running stability tests (skipped by default)",
]
